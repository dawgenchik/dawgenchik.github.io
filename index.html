<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Lenni</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@400,500;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>

<body class="body">
    <header class="page-header">
        <div class="page-header__container">
            <a class="page-header__logo" href="#">
                <img class="page-header_logo-icon" src="images/logo.svg" alt="logo" />
            </a>
            <nav class="page-header__nav">
                <a class="page-header__nav-link" href="#">Мероприятия</a>
                <a class="page-header__nav-link" href="#">Блог</a>
                <a class="page-header__nav-link" href="#">О нас</a>
                <a class="page-header__nav-link" href="#">Контакты</a>
            </nav>
            <div class="page-header__right-block">
                <a class="page-header__button btn" href="#">Войти</a>
            </div>
    </header>

    <main class="main">
        <div class="home">
            <div class="home__hero">
                <h1 class="home__title">АРТ-ПРОСТРАНСТВО</h1>
                <p class="home__subtitle">для людей, горящих сердцем и делом<br>место для настоящего</p>
            </div>

            <section class="offers home__offers">
                <h4 class="offers__title">я хочу</h4>
                <div class="offers__buttons">
                    <button class="offers__button offers__button--red" type="button">Провести мероприятие</button>
                    <button class="offers__button" type="button">Сдать арендатором</button>
                </div>
            </section>

            <section class="about home__about">
                <h2 class="about__title section-title">О нас</h2>
                <div class="about__container"></div>
            </section>

            <section class="upcoming home__upcoming">
                <h2 class="upcoming__title section-title">Мероприятия</h2>
                <div class="upcoming__container"></div>
            </section>

            <section class="listing home__listing">
                <h2 class="listing__title section-title">Блог</h2>
                <div class="listing__container"></div>
            </section>

            <section class="contacts home__contacts">
                <h2 class="contacts__title section-title">Контакты</h2>
                <div class="contacts__container"></div>
            </section>
        </div>
    </main>

    <footer class="page-footer">
        <div class="page-footer__container"></div>
    </footer>
</body>

</html>
